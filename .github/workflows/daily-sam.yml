name: Daily SAM.gov Opportunities

on:
  schedule:
    # Runs every day at 12:00 UTC. Adjust the cron as needed.
    - cron: "0 12 * * *"
  workflow_dispatch:   # allows manual runs from the Actions tab

permissions:
  contents: write      # needed to commit the updated spreadsheet back

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check that secrets are set (values not printed)
        env:
          SAM_API_KEY: ${{ secrets.SAM_API_KEY }}
          POSTMARK_API_TOKEN: ${{ secrets.POSTMARK_API_TOKEN }}
        run: |
          check() { if [ -z "$2" ]; then echo "$1: MISSING"; else echo "$1: set (length ${#2})"; fi; }
          check SAM_API_KEY "$SAM_API_KEY"
          check POSTMARK_API_TOKEN "$POSTMARK_API_TOKEN"

      - name: Run SAM opportunities script
        env:
          # API key comes from a GitHub secret, NOT from the committed .env
          SAM_API_KEY: ${{ secrets.SAM_API_KEY }}
          # Leave dates unset so the script uses today's date via datetime
          KEYWORD: "Gelsight, elastomeric"
          OUTPUT_FILE: GELSIGHT_OPPORTUNITIES.xlsx
          # Email settings (Postmark) — token from a GitHub secret
          POSTMARK_API_TOKEN: ${{ secrets.POSTMARK_API_TOKEN }}
          EMAIL_FROM: megha.manoj@gelsight.com
          EMAIL_TO: "kimo@gelsight.com, megha.manoj@gelsight.com"
        run: python sam_opportunities.py

      - name: Commit updated spreadsheet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add GELSIGHT_OPPORTUNITIES.xlsx
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update opportunities $(date -u +'%Y-%m-%d')"
            git push
          fi
